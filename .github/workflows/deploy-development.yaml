name: Deploy Development

on:
  push:
    branches:
      - develop  # Trigger on any push to the develop branch

permissions: 
  id-token: write
  contents: read
  pages: write

jobs:
  build:
    name: Build Static Website
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4: Build the static website using Parcel
      - name: Build Static Website
        run: npx parcel build src/Homepage.html

      # Step 5: Upload artifact for deployment
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/  # Ensure the output folder is correct

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build  # This ensures the build job completes first

    steps:
      # Step 6: Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
