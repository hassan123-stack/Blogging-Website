name: Deploy Development

on:
  push:
    branches:
      - develop  # Trigger on any push to the develop branch

permissions: 
  pages: write  # Allow deployment to GitHub Pages
  id-token: write  # Allow authentication for deployment

jobs:
  deploy:
    name: Build and Deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16  # Use Node.js version 16

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4: Build the static website using Parcel
      - name: Build Static Website
        run: npx parcel build src/Homepage.html

      # Step 5: Deploy the built website to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          path: dist/  # Deploy the 'dist' folder (output from Parcel)
